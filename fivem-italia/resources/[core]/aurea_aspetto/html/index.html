<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>AUREA · Aspetto</title>
  <link rel="stylesheet" href="stile.css">
</head>
<body class="oculto" id="radice">

  <aside class="pannello">
    <header>
      <div class="tricolore"></div>
      <div class="testata">
        <h1 id="titolo">Aspetto</h1>
        <p id="sottotitolo">Personalizza il tuo personaggio</p>
      </div>
    </header>

    <nav class="schede" id="schede"></nav>

    <div class="controlli" id="controlli"></div>

    <footer class="pie">
      <div class="costo">
        <span>Da pagare</span>
        <strong id="costo">0,00 €</strong>
      </div>
      <div class="azioni">
        <button class="btn" id="annulla">Annulla</button>
        <button class="btn btn-primario" id="conferma">Conferma</button>
      </div>
    </footer>
  </aside>

  <div class="suggerimenti">
    <span><b>A</b> / <b>D</b> ruota</span>
    <span><b>Rotella</b> zoom</span>
    <span><b>W</b> / <b>S</b> inquadratura</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
