<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>AUREA · Telefono</title>
  <link rel="stylesheet" href="stile.css">
</head>
<body class="oculto" id="radice" data-tema="scuro">

  <div class="telefono">
    <div class="scocca">
      <div class="notch"></div>

      <div class="schermo" id="schermo">

        <!-- Barra di stato -->
        <div class="barra-stato">
          <span id="ora">08:00</span>
          <span class="operatore" id="operatore">AUREA</span>
          <span class="segnale">▮▮▮▯</span>
        </div>

        <!-- Home -->
        <section class="vista attiva" id="vista-home">
          <div class="intestazione-home">
            <h1 id="home-nome">—</h1>
            <p id="home-numero">—</p>
          </div>
          <div class="app-griglia" id="app-griglia"></div>
        </section>

        <!-- App generica: qui dentro il telefono rende qualunque schermata -->
        <section class="vista" id="vista-app">
          <header class="testata-app">
            <button class="indietro" id="app-indietro">‹</button>
            <div class="testata-testo">
              <h2 id="app-titolo">—</h2>
              <p id="app-sottotitolo"></p>
            </div>
            <div class="testata-azioni" id="app-barra"></div>
          </header>
          <div class="corpo" id="app-corpo"></div>
          <form class="composizione oculto" id="form-chat">
            <input type="text" id="chat-testo" placeholder="Scrivi un messaggio"
                   maxlength="300" autocomplete="off">
            <button type="submit">➤</button>
          </form>
        </section>

        <!-- Chiamata a tutto schermo -->
        <section class="chiamata oculto" id="chiamata">
          <div class="chiamata-avatar" id="chiamata-iniziale">?</div>
          <h2 id="chiamata-nome">—</h2>
          <p id="chiamata-numero">—</p>
          <p class="chiamata-stato" id="chiamata-stato">Sta squillando…</p>
          <div class="chiamata-tasti" id="chiamata-tasti"></div>
        </section>

        <!-- Foglio di scelta rapida -->
        <div class="foglio oculto" id="foglio">
          <div class="foglio-corpo">
            <h3 id="foglio-titolo">—</h3>
            <div id="foglio-voci"></div>
            <button class="foglio-annulla" id="foglio-annulla">Annulla</button>
          </div>
        </div>

        <!-- Avviso a scomparsa -->
        <div class="brindisi oculto" id="brindisi"></div>

        <div class="barra-home" id="barra-home"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
