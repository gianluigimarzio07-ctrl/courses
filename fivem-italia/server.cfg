# =============================================================================
#  AUREA · Italia Roleplay — configurazione del server
#
#  PRIMA DI AVVIARE — nell'ordine:
#
#    0. lancia ./installa.sh (Linux/macOS) o installa.bat (Windows).
#       Le risorse ci sono già tutte, comprese quelle di base in
#       resources/[base]/: quello che manca è soltanto l'eseguibile di
#       FXServer, che esce nuovo ogni settimana e che lo script scarica
#       da Cfx.re. Se lo hai già, lo script se ne accorge e lo salta.
#
#    1. importa sql/01_schema.sql e sql/02_dati_iniziali.sql nel database
#    2. imposta la stringa di connessione qui sotto
#    3. genera le chiavi su https://keymaster.fivem.net e incollale in sv_licenseKey
#    4. metti la tua license in add_principal, in fondo, per i permessi da fondatore
#    5. NON committare mai questo file con chiavi o webhook reali
# =============================================================================

# -----------------------------------------------------------------------------
#  Rete
# -----------------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 64
sv_hostname "AUREA · Italia Roleplay | Whitelist | Seria"
sv_projectName "AUREA"
sv_projectDesc "Roleplay ambientato in Italia: codice della strada, fisco, 112, filiere Made in Italy"
sv_licenseKey "INSERISCI_QUI_LA_TUA_CHIAVE"
sv_enforceGameBuild 3095

# Scoreboard e lingua
sets locale "it-IT"
sets tags "roleplay, italiano, italia, seria, whitelist, economia"
sets banner_connecting ""
sets banner_detail ""
sets discord "https://discord.gg/IL_TUO_INVITO"

# -----------------------------------------------------------------------------
#  Database (oxmysql)
# -----------------------------------------------------------------------------
set mysql_connection_string "mysql://aurea:PASSWORD@localhost/aurea?charset=utf8mb4"
set mysql_slow_query_warning 200
set mysql_debug false

# -----------------------------------------------------------------------------
#  Impostazioni AUREA
# -----------------------------------------------------------------------------
# Whitelist: 1 attiva, 0 accesso libero
setr aurea_whitelist 0

# Webhook Discord del registro. Lasciare vuoti per disattivare il canale.
# Non vanno mai messi sotto controllo di versione.
setr aurea_webhook_connessioni ""
setr aurea_webhook_denaro      ""
setr aurea_webhook_inventario  ""
setr aurea_webhook_veicoli     ""
setr aurea_webhook_multe       ""
setr aurea_webhook_giustizia   ""
setr aurea_webhook_anticheat   ""
setr aurea_webhook_staff       ""
setr aurea_webhook_economia    ""

# -----------------------------------------------------------------------------
#  Permessi console
# -----------------------------------------------------------------------------
add_ace group.admin command allow
add_principal identifier.license:INSERISCI_LA_TUA_LICENSE group.admin

# -----------------------------------------------------------------------------
#  Risorse di sistema
# -----------------------------------------------------------------------------
# Queste arrivano dentro l'eseguibile di FXServer, in
# citizen/system_resources/: non stanno in resources/ e si trovano da sole.
ensure chat
ensure sessionmanager
ensure hardcap

# Queste stanno in resources/[base]/, incluse nel pacchetto. Vedi
# resources/[base]/LEGGIMI.md per da dove vengono e con che licenza.
ensure mapmanager
ensure spawnmanager
ensure baseevents

# NON si avvia basic-gamemode, ed è voluto.
#
# Quella risorsa accende l'autospawn e fa rinascere il giocatore appena la
# mappa parte. Qui la nascita passa dalla selezione del personaggio in
# aurea_spawn: con l'autospawn acceso ti ritroveresti in strada mentre
# stai ancora scegliendo chi essere.
#
# In AUREA il tipo di gioco è AUREA.

# Il database. È l'unica dipendenza vera del framework: se qui leggi
# "Couldn't find resource oxmysql", la cartella resources/[base]/ è stata
# svuotata e senza quella non parte niente.
ensure oxmysql

# NON si avvia pma-voice, e nemmeno quella è una dimenticanza.
#
# La voce la fa aurea_voce con le natives di FiveM, e regola la portata con
# NetworkSetTalkerProximity. Il README di pma-voice chiede espressamente di
# non toccare quella native da altri script, perché gli rompe il conteggio
# delle distanze. Accese insieme si contendono la stessa manopola.
#
# Se preferisci pma-voice — ha la radio a canali e il submix, che noi non
# abbiamo — installala e togli "ensure aurea_voce" dal blocco qui sotto.
# Una delle due, mai tutte e due.

