# =============================================================================
#  AUREA · Italia Roleplay — configurazione del server
#
#  Prima di avviare:
#    1. importa sql/01_schema.sql e sql/02_dati_iniziali.sql nel database
#    2. imposta la stringa di connessione qui sotto
#    3. genera le chiavi su https://keymaster.fivem.net e incollale in sv_licenseKey
#    4. NON committare mai questo file con chiavi o webhook reali
# =============================================================================

# -----------------------------------------------------------------------------
#  Rete
# -----------------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 64
sv_hostname "AUREA · Italia Roleplay | Whitelist | Seria"
sv_projectName "AUREA"
sv_projectDesc "Roleplay ambientato in Italia: codice della strada, fisco, 112, filiere Made in Italy"
sv_licenseKey "INSERISCI_QUI_LA_TUA_CHIAVE"
sv_enforceGameBuild 3095

# Scoreboard e lingua
locale "it-IT"
sets locale "it-IT"
sets tags "roleplay, italiano, italia, seria, whitelist, economia"
sets banner_connecting ""
sets banner_detail ""
sets discord "https://discord.gg/IL_TUO_INVITO"

# -----------------------------------------------------------------------------
#  Database (oxmysql)
# -----------------------------------------------------------------------------
set mysql_connection_string "mysql://aurea:PASSWORD@localhost/aurea?charset=utf8mb4"
set mysql_slow_query_warning 200
set mysql_debug false

# -----------------------------------------------------------------------------
#  Impostazioni AUREA
# -----------------------------------------------------------------------------
# Whitelist: 1 attiva, 0 accesso libero
setr aurea_whitelist 0

# Webhook Discord del registro. Lasciare vuoti per disattivare il canale.
# Non vanno mai messi sotto controllo di versione.
setr aurea_webhook_connessioni ""
setr aurea_webhook_denaro      ""
setr aurea_webhook_inventario  ""
setr aurea_webhook_veicoli     ""
setr aurea_webhook_multe       ""
setr aurea_webhook_giustizia   ""
setr aurea_webhook_anticheat   ""
setr aurea_webhook_staff       ""
setr aurea_webhook_economia    ""

# -----------------------------------------------------------------------------
#  Permessi console
# -----------------------------------------------------------------------------
add_ace group.admin command allow
add_principal identifier.license:INSERISCI_LA_TUA_LICENSE group.admin

# -----------------------------------------------------------------------------
#  Risorse di sistema
# -----------------------------------------------------------------------------
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap

# Dipendenza esterna: https://github.com/overextended/oxmysql
ensure oxmysql

# -----------------------------------------------------------------------------
#  AUREA — risorse
#
#  L'ordine è un ordinamento topologico delle dipendenze dichiarate nei
#  manifest: ogni risorsa parte dopo tutto ciò che le serve. Se aggiungi un
#  modulo che usa gli export di un altro, dichiaralo in "dependencies" e
#  inseriscilo qui dopo di quello.
# -----------------------------------------------------------------------------
ensure aurea_core
ensure aurea_ui
ensure aurea_admin
ensure aurea_anticheat
ensure ita_codicestrada
ensure ita_fisco
ensure aurea_banca
ensure aurea_inventory
ensure aurea_case
ensure ita_veicoli
ensure aurea_garage
ensure aurea_hud
ensure aurea_lavori
ensure aurea_logs
ensure aurea_medico
ensure aurea_negozi
ensure aurea_spawn
ensure aurea_telefono
ensure ita_112
ensure ita_ambiente
ensure ita_economia
ensure ita_giustizia
ensure ita_famiglie
ensure ita_madeinitaly

# -----------------------------------------------------------------------------
#  Impostazioni di gioco
# -----------------------------------------------------------------------------
# La sincronizzazione delle entità la gestisce il server
set onesync on
set onesync_population true
set onesync_enableInfinity true
set onesync_enableBeyond true

# Niente rigenerazione automatica, niente stelle di ricercato
set sv_enforceGameBuildVehicles true
set sv_scriptHookAllowed 0

# Aumenta il tetto di eventi al secondo: AUREA ne usa parecchi
set sv_endpointprivacy true
set sv_useDirectListing true
