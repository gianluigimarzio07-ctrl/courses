# -----------------------------------------------------------------------------
#  Compatibilità ESX  (facoltativa — vedi docs/ESX.md)
#
#  Si sceglie UNA delle due righe, mai tutte e due: fanno il percorso
#  opposto e accese insieme si rincorrono.
#
#  A) ESX costruito sopra AUREA. Fa girare i tuoi script esx_* senza
#     installare il vero es_extended, e senza perdere un centesimo perché
#     AUREA resta autoritativa. È la strada consigliata se parti da zero.
#     Richiede C.Framework = 'nativo' (che è già il default).
#
# ensure es_extended
#
#  B) AUREA sopra il vero es_extended. Da usare solo se hai già un server
#     ESX in piedi con giocatori dentro. Richiede il vero es_extended
#     installato, C.Framework = 'esx' in aurea_core/shared/config.lua,
#     "ensure aurea_spawn" tolto qui sopra, e sql/esx/01_lavori.sql più
#     sql/esx/02_oggetti.sql eseguiti.
#
# ensure aurea_esx
#
#  Gli script ESX di terze parti vanno dopo la riga che hai scelto.
# -----------------------------------------------------------------------------


# -----------------------------------------------------------------------------
#  Impostazioni di gioco
# -----------------------------------------------------------------------------
# La sincronizzazione delle entità la gestisce il server
set onesync on
set onesync_population true
set onesync_enableInfinity true
set onesync_enableBeyond true

# Niente rigenerazione automatica, niente stelle di ricercato
set sv_enforceGameBuildVehicles true
set sv_scriptHookAllowed 0

# Aumenta il tetto di eventi al secondo: AUREA ne usa parecchi
set sv_endpointprivacy true
set sv_useDirectListing true
